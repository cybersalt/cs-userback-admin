; Billing and data disclosure note (top of the settings)
PLG_SYSTEM_CS_USERBACKADMIN_BILLING_NOTE_LABEL="Userback account, billing and data sent"
PLG_SYSTEM_CS_USERBACKADMIN_BILLING_NOTE_DESC="<p><strong>Userback is a separate, paid third-party service.</strong> This plugin only connects your Joomla site to it.</p><ul><li><strong>Billing:</strong> you need your own Userback account (<a href='https://userback.io' target='_blank' rel='noopener'>userback.io</a>). Any plan fees, usage limits and invoices are between you and Userback. Cybersalt does not bill for Userback and this plugin adds no charge of its own.</li><li><strong>Access token:</strong> open your project in your Userback dashboard and copy the access token from the widget installation snippet (it looks like <code>P-xxxxxxxxxxxxxxxxxxxxxxxxxx</code>). Paste it below, or paste the whole snippet in Full Script mode.</li><li><strong>Data sent to Userback:</strong> whenever the widget loads, the visitor's browser sends Userback the Joomla user ID, name, email address and user group IDs, the Joomla version, the full URL of the page (including any query string), the component, view, layout and item ID, the template name, the host name, plus anything you add under Custom Data Extras. Whatever the visitor types, captures or records in the feedback form is sent too. Guests are sent as 'Guest' with no email address.</li><li><strong>Who is affected:</strong> only people who are shown the widget under the Backend and Frontend settings. Review Userback's privacy policy (linked from <a href='https://userback.io' target='_blank' rel='noopener'>userback.io</a>) and mention Userback in your own privacy policy if you show the widget to visitors.</li></ul>"

