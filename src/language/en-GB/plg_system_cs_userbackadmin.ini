PLG_SYSTEM_CS_USERBACKADMIN_SUPPORT_NOTE_DESC="These details appear in this plugin's admin messages (for example when you try to enable the plugin without an access token) so you know where to get help. The defaults point to Cybersalt support. You can also open an issue on <a href='https://github.com/cybersalt/cs-userback-admin/issues' target='_blank' rel='noopener'>GitHub</a>."
